  <text x="70" y="270" font-size="12" fill="#94a3b8">OGF (OpCode Group Field)</text>
  <text x="70" y="298" font-size="18" font-weight="700" fill="#a855f7" font-family="Courier, monospace">0x08 (LE Controller)</text>

  <rect x="320" y="245" width="245" height="75" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
