  <rect x="635" y="565" width="510" height="42" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1" />
  <text x="650" y="591" font-size="12" font-weight="700" fill="#34d399">[PASS] RULE-06: Channel map 0x07 (Channels 37, 38, 39 enabled)</text>

