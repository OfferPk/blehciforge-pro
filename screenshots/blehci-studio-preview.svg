  <rect x="635" y="465" width="510" height="42" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1" />
  <text x="650" y="491" font-size="12" font-weight="700" fill="#34d399">[PASS] RULE-03: Length field matches payload (15 == 15 octets)</text>

